operations:
  -
    operation_id: "list_ad_accounts"
    display_name: "List ad accounts"
    description: "Meta Ads v1: list ad accounts"
    operation_kind: "action"
    workflow_visible: true
    connection_type_ids:
      - "meta_ads_account"
    category: "advertising"
    inputs:
      -
        name: "connection_ref"
        value_type: "connection_ref"
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 255
      -
        name: "cursor"
        value_type: "text"
        required: false
        schema:
          type: "string"
          minLength: 1
          maxLength: 2048
      -
        name: "limit"
        value_type: "integer"
        required: false
        schema:
          type: "integer"
          minimum: 1
          maximum: 100
    outputs:
      -
        name: "accounts"
        value_type: "array"
      -
        name: "next_cursor"
        value_type: "text"
    result_fields:
      - "result.accounts"
      - "result.next_cursor"
    error_codes:
      - "invalid_payload"
      - "invalid_host_envelope"
      - "invalid_connection"
      - "authorization_required"
      - "permission_denied"
      - "not_found"
      - "unsupported_configuration"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout_unknown"
      - "artifact_unavailable"
      - "external_effect_claim_required"
      - "internal_error"
