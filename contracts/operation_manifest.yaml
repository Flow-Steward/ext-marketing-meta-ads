          minLength: 1
          maxLength: 255
      -
        name: "image_hash"
        value_type: "text"
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 255
      -
        name: "page_id"
        value_type: "text"
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 255
      -
        name: "instagram_account_id"
        value_type: "text"
        required: false
        schema:
          type: "string"
          minLength: 1
          maxLength: 255
      -
        name: "placements"
        value_type: "text"
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 255
          enum:
            - "facebook"
            - "instagram"
            - "both"
      -
        name: "primary_text"
        value_type: "text"
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 2000
      -
        name: "headline"
        value_type: "text"
        required: false
        schema:
          type: "string"
          minLength: 1
          maxLength: 100
      -
        name: "destination_url"
        value_type: "text"
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 2048
      -
        name: "cta"
        value_type: "text"
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 255
          enum:
            - "LEARN_MORE"
            - "SHOP_NOW"
      -
        name: "utm"
        value_type: "object"
        required: false
        schema:
          type: "object"
          additionalProperties: false
          properties:
            utm_source:
              type: "string"
              minLength: 1
              maxLength: 255
            utm_medium:
              type: "string"
              minLength: 1
              maxLength: 255
            utm_campaign:
              type: "string"
              minLength: 1
              maxLength: 255
            utm_content:
              type: "string"
              minLength: 1
              maxLength: 255
            utm_term:
              type: "string"
              minLength: 1
              maxLength: 255
    outputs:
      -
        name: "creative_id"
        value_type: "text"
      -
        name: "ad_account_id"
        value_type: "text"
    result_fields:
      - "result.creative_id"
      - "result.ad_account_id"
    error_codes:
      - "invalid_payload"
      - "invalid_host_envelope"
      - "invalid_connection"
      - "authorization_required"
      - "permission_denied"
      - "not_found"
      - "unsupported_configuration"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout_unknown"
      - "artifact_unavailable"
      - "external_effect_claim_required"
      - "internal_error"
