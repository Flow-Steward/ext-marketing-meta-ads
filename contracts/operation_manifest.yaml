  -
    operation_id: "create_creative"
    display_name: "Create creative"
    description: "Meta Ads v1: create creative"
    operation_kind: "action"
    workflow_visible: true
    connection_type_ids:
      - "meta_ads_account"
    category: "advertising"
    inputs:
      -
        name: "connection_ref"
        value_type: "connection_ref"
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 255
      -
        name: "name"
        value_type: "text"
