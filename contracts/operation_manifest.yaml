  -
    operation_id: "create_ad_set"
    display_name: "Create ad set"
    description: "Meta Ads v1: create ad set"
    operation_kind: "action"
    workflow_visible: true
    connection_type_ids:
      - "meta_ads_account"
    category: "advertising"
    inputs:
      -
        name: "connection_ref"
        value_type: "connection_ref"
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 255
      -
        name: "campaign_id"
        value_type: "text"
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 255
      -
        name: "name"
        value_type: "text"
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 255
      -
        name: "countries"
        value_type: "array"
        required: true
        schema:
          type: "array"
          minItems: 1
          maxItems: 50
          items:
            type: "string"
            minLength: 2
            maxLength: 2
      -
        name: "age_min"
        value_type: "integer"
        required: true
        schema:
          type: "integer"
          minimum: 18
          maximum: 65
      -
        name: "age_max"
        value_type: "integer"
        required: true
        schema:
          type: "integer"
          minimum: 18
          maximum: 65
      -
        name: "daily_budget"
        value_type: "text"
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 255
      -
        name: "start_time"
        value_type: "text"
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 255
          format: "date-time"
      -
        name: "end_time"
        value_type: "text"
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 255
          format: "date-time"
      -
        name: "placements"
        value_type: "text"
        required: true
        schema:
          type: "string"
          minLength: 1
          maxLength: 255
          enum:
            - "facebook"
            - "instagram"
            - "both"
      -
        name: "dsa_beneficiary"
        value_type: "text"
        required: false
        schema:
          type: "string"
          minLength: 1
          maxLength: 255
      -
        name: "dsa_payor"
        value_type: "text"
        required: false
        schema:
          type: "string"
          minLength: 1
          maxLength: 255
    outputs:
      -
        name: "ad_set_id"
        value_type: "text"
      -
        name: "campaign_id"
        value_type: "text"
      -
        name: "ad_account_id"
        value_type: "text"
      -
        name: "configured_status"
        value_type: "text"
      -
        name: "effective_status"
        value_type: "text"
    result_fields:
      - "result.ad_set_id"
      - "result.campaign_id"
      - "result.ad_account_id"
      - "result.configured_status"
      - "result.effective_status"
    error_codes:
      - "invalid_payload"
      - "invalid_host_envelope"
      - "invalid_connection"
      - "authorization_required"
      - "permission_denied"
      - "not_found"
      - "unsupported_configuration"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout_unknown"
      - "artifact_unavailable"
      - "external_effect_claim_required"
      - "internal_error"
