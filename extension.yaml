manifest_version: 2
lifecycle:
  data_schema_version: 1
  data_migrations: []
extension_id: "flowsteward.meta-ads"
kind: "tool_provider"
version: "1.0.3"
display_name: "Meta Ads"
description: "Create paused website traffic campaigns and single-image Facebook and Instagram feed ads from workflows."
vendor:
  name: "Flow Steward"
  support_url: "https://github.com/Flow-Steward/ext-marketing-meta-ads/issues"
listing:
  category: "marketing"
  description: |-
    Meta Ads connects Flow Steward workflows to Facebook and Instagram advertising. Discover accessible advertising accounts and Page/Instagram identities, create campaigns and ad sets, upload an approved image artifact, build a creative and create an ad. Read object status and explicitly activate or pause one selected campaign, ad set or ad.

    Use it to prepare a complete paused campaign or add a single-image ad to a compatible existing ad set. The supported profile is website traffic optimized for link clicks, with daily ad-set budgets, explicit country/age targeting and scheduled dates. Placements are Facebook Feed, Instagram Feed or both. New campaigns, ad sets and ads are paused; activation does not automatically activate parents or children, and ACTIVE does not prove approval or delivery.

    Setup requires an operator-owned Meta app, native OAuth authorization and one selected advertising account per project connection. Instagram ads require an explicitly selected professional account linked to the selected Page. Images must be granted 1080 x 1080 JPEG/PNG artifacts up to 5 MiB. Video, carousel, organic posting, reporting, custom audiences, campaign budgets and special advertising categories are outside this version. Live OAuth and actual advertising-object acceptance have not been verified.
  tags:
    - "meta"
    - "facebook"
    - "instagram"
    - "advertising"
  summary: "Create paused website traffic campaigns and single-image Facebook and Instagram feed ads from workflows."
  setup_summary: "Configure your own Meta app with Marketing API and Facebook Login, register the exact callback URL shown by Flow Steward, and save the App ID and secret in native OAuth setup. Authorize the required permissions, then verify and select one advertising account for the project connection. For Instagram select a linked professional account and Page. App Review, business verification and account permissions are managed by your operator."
features:
  - "tool"
  - "action"
required_scopes:
  - "extension:invoke"
  - "artifact:read"
machine_auth:
  service_account_key: "svc_ext_meta_ads"
  required_scopes:
    - "extension:invoke"
    - "artifact:read"
account_scope:
  scope_type: "project"
  description: "One selected advertising account per project connection."
egress:
  hosts:
    - "graph.facebook.com"
external_effects:
  -
    operation_id: "create_campaign"
    effect_kind: "meta_ads_create_campaign"
    channel: "meta_ads"
    idempotency: "required"
    test_mode_behavior: "suppress"
  -
    operation_id: "create_ad_set"
    effect_kind: "meta_ads_create_ad_set"
    channel: "meta_ads"
    idempotency: "required"
    test_mode_behavior: "suppress"
  -
    operation_id: "upload_image"
    effect_kind: "meta_ads_upload_image"
    channel: "meta_ads"
    idempotency: "required"
    test_mode_behavior: "suppress"
  -
    operation_id: "create_creative"
    effect_kind: "meta_ads_create_creative"
    channel: "meta_ads"
    idempotency: "required"
    test_mode_behavior: "suppress"
  -
    operation_id: "create_ad"
    effect_kind: "meta_ads_create_ad"
    channel: "meta_ads"
    idempotency: "required"
    test_mode_behavior: "suppress"
  -
    operation_id: "set_delivery_status"
    effect_kind: "meta_ads_set_delivery_status"
    channel: "meta_ads"
    idempotency: "required"
    test_mode_behavior: "suppress"
runtime_grants:
  resources:
    project_connection: {}
  mutations:
    project_connection_config_compare_and_set: {}
runtime:
  contract_version: "extension_host_v2"
  extension_contract_v2:
    oauth_providers:
      -
        provider_id: "meta_ads_oauth"
        display_name: "Meta Ads"
        description: "Operator-owned Meta OAuth application for advertising workflows."
        setup_page_id: "setup"
        help_page_id: "setup"
        flow:
          type: "authorization_code"
          pkce: "s256"
        scope_separator: "comma"
        credential_fields:
          -
            field_id: "client_id"
            value_type: "text"
            required: true
            secret: false
            change_policy: "reauthorization_required"
            label: "Meta App ID"
            help_text: "Enter the App ID from Meta for Developers."
            autocomplete: "username"
            validation:
              min_length: 1
              max_length: 512
          -
            field_id: "client_secret"
            value_type: "secret"
            required: true
            secret: true
            change_policy: "runtime_revalidate"
            label: "Meta App Secret"
            help_text: "Enter the matching Meta App Secret."
            autocomplete: "current-password"
            validation:
              min_length: 1
              max_length: 4096
        authorization_endpoint:
          url: "https://www.facebook.com/v27.0/dialog/oauth"
        token_endpoint:
          url: "https://graph.facebook.com/v27.0/oauth/access_token"
          client_auth_method: "client_secret_post"
        code_exchange:
          include_grant_type: false
          implicit_token_type: "bearer"
          required_response_fields:
            - "access_token"
            - "expires_in"
        callback_id: "oauth_authorization"
        authorization_intents:
          -
            intent_id: "connect"
            static_parameters:
              auth_type: "rerequest"
        post_connect_action_id: "verify_meta_identity"
    connection_types: "contracts/connection_types.yaml"
    operation_manifest: "contracts/operation_manifest.yaml"
    step_ui_manifest: "contracts/step_ui_manifest.yaml"
    artifact_policies: "contracts/artifact_policies.yaml"
artifact_policies:
  -
    operation_id: "upload_image"
    inputs:
      -
        kind: "artifact"
        value_type: "artifact_handle"
        binding_key: "meta_image"
        field: "image_artifact"
        required: true
        max_size_bytes: 5242880
entrypoint:
  mode: "subprocess"
  command:
    - "python3"
    - "main.py"
  timeout_seconds: 120
health:
  command:
    - "python3"
    - "health.py"
  timeout_seconds: 5
ui_manifest: "ui/ui_manifest.yaml"
action_manifest: "ui/actions/actions.yaml"
callbacks:
  -
    callback_id: "oauth_authorization"
    purpose: "oauth_authorization"
    methods:
      - "GET"
    connection_scoped: false
python_requirements:
  -
    name: "pillow"
    version: "13.0.0"
    hashes:
      - "sha256:8bf295fe459343bc6093c8e5e0df60bfa189e0fcb775a22e2c2488fdeccc6c0d"
      - "sha256:42d63be3af4f9b951b199b0a9d23365d37ab14687e6d77b74940432c8515c4ca"
