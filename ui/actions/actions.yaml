actions:
  -
    action_id: "list_ad_accounts"
    title: "List ad accounts"
    required_scopes:
      - "extension:invoke"
    handler:
      mode: "extension"
    mutates_platform: false
    workflow_visible: true
    parameters:
      -
        name: "connection_ref"
        type: "connection_ref"
        required: true
      -
        name: "cursor"
        type: "string"
        required: false
      -
        name: "limit"
        type: "integer"
        required: false
    result_fields:
      - "result.accounts"
      - "result.next_cursor"
    error_codes:
      - "invalid_payload"
      - "invalid_host_envelope"
      - "invalid_connection"
      - "authorization_required"
      - "permission_denied"
      - "not_found"
      - "unsupported_configuration"
      - "rate_limited"
      - "provider_unavailable"
      - "timeout_unknown"
      - "artifact_unavailable"
      - "external_effect_claim_required"
      - "internal_error"
